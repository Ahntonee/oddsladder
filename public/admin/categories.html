<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Categories — OL Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link rel="icon" href="/images/logo.png">
<link rel="apple-touch-icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div id="admin-sidebar"></div>
<div id="admin-topbar"></div>
<main id="admin-main">
  <h1 class="admin-section-title">Categories Performance</h1>

  <div class="data-table-wrap admin-card" style="padding:0;margin-bottom:24px">
    <table class="data-table">
      <thead><tr><th>Category</th><th>Total Tips</th><th>Won</th><th>Lost</th><th>Void</th><th>Win Rate</th><th>Avg Confidence</th></tr></thead>
      <tbody id="cat-body"></tbody>
    </table>
  </div>

  <div class="admin-card">
    <h3 style="font-size:15px;margin-bottom:16px">Win Rate by Category</h3>
    <div class="chart-wrap"><canvas id="cat-chart"></canvas></div>
  </div>
</main>
<script src="admin.js"></script>
<script>
injectAdminShell('categories.html');

const CATEGORIES = ['Free','VIP','Banker','Daily Special','Accumulator','Weekend Special','Midweek Special','Early Bird','Last Minute'];
const COLORS = ['#02f5a1','#99cc33','#faf92a','#addff1','#ff6b6b','#a29bfe','#fd79a8','#55efc4','#fdcb6e'];

document.addEventListener('DOMContentLoaded', loadCategories);

async function loadCategories() {
  const d = await api('/predictions/stats');
  const bycat = d.data?.byCategory || {};
  const rows = CATEGORIES.map(cat => {
    const s = bycat[cat] || {};
    const total = s.total || 0;
    const won = s.won || 0;
    const lost = s.lost || 0;
    const void_ = s.void || 0;
    const rate = total > 0 ? ((won / total) * 100).toFixed(1) : '—';
    return { cat, total, won, lost, void: void_, rate, avg_conf: s.avg_confidence || 0 };
  });

  document.getElementById('cat-body').innerHTML = rows.map(r => `<tr>
    <td><strong>${escHtml(r.cat)}</strong></td>
    <td>${r.total}</td>
    <td style="color:var(--primary)">${r.won}</td>
    <td style="color:var(--danger)">${r.lost}</td>
    <td class="text-muted">${r.void}</td>
    <td><strong style="color:${parseFloat(r.rate)>=65?'var(--primary)':parseFloat(r.rate)>=50?'var(--accent)':'var(--danger)'}">${r.rate}%</strong></td>
    <td>${r.avg_conf ? parseFloat(r.avg_conf).toFixed(0) : '—'}</td>
  </tr>`).join('');

  const ctx = document.getElementById('cat-chart').getContext('2d');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: rows.map(r => r.cat),
      datasets: [
        { label: 'Won', data: rows.map(r => r.won), backgroundColor: 'rgba(2,245,161,0.7)', borderRadius: 4 },
        { label: 'Lost', data: rows.map(r => r.lost), backgroundColor: 'rgba(255,71,87,0.6)', borderRadius: 4 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { stacked: false, ticks: { color: 'rgba(173,223,241,0.6)', font:{size:11} } },
        y: { ticks: { color: 'rgba(173,223,241,0.6)' } }
      },
      plugins: { legend: { labels: { color: 'rgba(173,223,241,0.75)' } } }
    }
  });
}
</script>
</body>
</html>
